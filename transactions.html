<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi &amp; Akun - AutoOrder</title>
  <meta name="description" content="Riwayat transaksi pemesanan aplikasi premium dan detail akun terkirim otomatis.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white" data-requires-auth="true">

  <!-- Shared Navbar Target -->
  <div id="shared-navbar"></div>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Page Title -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-3">
            <span>📋 Riwayat Transaksi</span>
          </h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">Lihat status pesanan dan rincian login akun premium yang dikirim secara otomatis oleh bot.</p>
        </div>
        <a href="catalog.html" class="self-start sm:self-auto gradient-btn px-4 py-2 rounded-xl text-xs font-bold text-white shadow-md shadow-indigo-500/20 flex items-center gap-1.5">
          <span>+</span> Order Aplikasi Baru
        </a>
      </div>

      <!-- Status Filter Tabs -->
      <div class="glass-panel p-2 rounded-2xl border border-slate-800 mb-8 flex items-center gap-1.5 overflow-x-auto no-scrollbar shadow-lg">
        <button 
          type="button" 
          class="status-tab px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-md shadow-indigo-500/20 whitespace-nowrap transition-all"
          data-status="Semua"
        >
          Semua Status
        </button>
        <button 
          type="button" 
          class="status-tab px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700/80 whitespace-nowrap transition-all"
          data-status="Pending"
        >
          ⏳ Pending
        </button>
        <button 
          type="button" 
          class="status-tab px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700/80 whitespace-nowrap transition-all"
          data-status="Diproses"
        >
          ⚡ Diproses
        </button>
        <button 
          type="button" 
          class="status-tab px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700/80 whitespace-nowrap transition-all"
          data-status="Selesai"
        >
          ✅ Selesai
        </button>
        <button 
          type="button" 
          class="status-tab px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-white hover:bg-slate-700/80 whitespace-nowrap transition-all"
          data-status="Dibatalkan"
        >
          ❌ Dibatalkan
        </button>
      </div>

      <!-- Transactions List Container -->
      <div id="transactions-container" class="space-y-4">
        <!-- Injected dynamically by js/transactions.js -->
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
