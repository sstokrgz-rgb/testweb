<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun - AutoOrder Premium Store</title>
  <meta name="description" content="Masuk ke akun AutoOrder Premium Anda untuk membeli dan mengelola pesanan aplikasi premium.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-x-hidden selection:bg-purple-500 selection:text-white" data-requires-auth="false">

  <!-- Background Glow Accents -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[500px] h-[350px] bg-gradient-to-tr from-indigo-600/20 to-purple-600/20 blur-[130px] rounded-full pointer-events-none -z-10"></div>
  <div class="absolute top-10 right-10 w-60 h-60 bg-purple-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Main Container -->
  <div class="w-full max-w-md my-8">
    <!-- Brand Logo Header -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2.5 group mb-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-0.5 shadow-lg shadow-purple-500/30 group-hover:scale-105 transition-transform">
          <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
            <span class="text-2xl">⚡</span>
          </div>
        </div>
        <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">AutoOrder</span>
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Selamat Datang Kembali</h1>
      <p class="text-xs text-slate-400 mt-1">Masuk ke akun untuk melanjutkan transaksi aplikasi premium Anda</p>
    </div>

    <!-- Login Card -->
    <div class="glass-panel rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl relative">
      <!-- Error Alert Box -->
      <div id="auth-error-alert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
      </div>

      <form id="login-form" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-300 mb-1.5">Alamat Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              placeholder="email@example.com" 
              required
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold text-slate-300">Kata Sandi</label>
            <a href="https://t.me/tesbothac_bot" target="_blank" class="text-[11px] text-indigo-400 hover:text-indigo-300">Lupa kata sandi?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              placeholder="Masukkan kata sandi" 
              required
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="login-submit-btn" 
          class="w-full mt-2 gradient-btn py-3 rounded-xl text-sm font-bold text-white shadow-lg shadow-indigo-500/25 active:scale-[0.99] transition-all flex items-center justify-center"
        >
          Masuk ke Akun
        </button>
      </form>

      <!-- Bot Integration Reminder -->
      <div class="mt-5 p-3 rounded-xl bg-slate-900/60 border border-slate-800 text-[11px] text-slate-400 flex items-center gap-2">
        <span class="text-base">🤖</span>
        <span>Akun Anda terhubung dengan bot verifikasi Telegram & WhatsApp untuk keamanan ganda.</span>
      </div>

      <!-- Footer Link to Register -->
      <div class="mt-6 pt-5 border-t border-slate-800/80 text-center text-xs text-slate-400">
        Belum memiliki akun? 
        <a href="register.html" class="text-indigo-400 font-semibold hover:text-indigo-300 ml-1">
          Daftar Sekarang
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
