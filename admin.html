<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - AutoOrder Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stat-card { transition: all .3s ease; }
    .stat-card:hover { transform: translateY(-2px); }
    .pulse-live { animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .sidebar-link.active { background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(249,115,22,.1)); border-left: 3px solid #f59e0b; color: #fbbf24; }
    .sidebar-link:not(.active):hover { background: rgba(255,255,255,.05); }
    .admin-table tr:hover td { background: rgba(255,255,255,.02); }
    .badge { padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; }
    .badge-green { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
    .badge-red { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
    .badge-yellow { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
    .badge-blue { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
    .badge-purple { background: rgba(139,92,246,.15); color: #a78bfa; border: 1px solid rgba(139,92,246,.3); }
  </style>
  <script>
    const adminProductImages = new Map();

    function normalizeImageUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      if (!trimmed || trimmed === 'default-product.png') return '';
      try {
        if (trimmed.includes('google.') && trimmed.includes('imgurl=')) {
          const u = new URL(trimmed);
          const extracted = u.searchParams.get('imgurl');
          if (extracted) return decodeURIComponent(extracted);
        }
      } catch (e) {}
      return trimmed;
    }

    function updateProdImagePreview(url) {
      const preview = document.getElementById('prod-image-preview');
      if (!preview) return;
      const clean = normalizeImageUrl(url);
      if (clean) {
        preview.innerHTML = `<img src="${clean}" referrerpolicy="no-referrer" alt="Logo" class="w-full h-full object-cover rounded-xl" onerror="this.parentElement.textContent='📦'">`;
      } else {
        preview.textContent = '📦';
      }
    }

    const _origAdminFetch = window.fetch.bind(window);
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || '');
      const method = (init?.method || 'GET').toUpperCase();

      if (url.includes('/api/admin/products') && (method === 'POST' || method === 'PUT') && init && init.body) {
        try {
          const bodyObj = JSON.parse(init.body);
          const imgInput = document.getElementById('prod-image');
          if (imgInput) {
            const cleanUrl = normalizeImageUrl(imgInput.value);
            bodyObj.image = cleanUrl || 'default-product.png';
            init.body = JSON.stringify(bodyObj);
          }
        } catch (e) {}
      }

      const response = await _origAdminFetch(input, init);

      if (url.includes('/api/admin/products') && method === 'GET') {
        response.clone().json().then(resData => {
          const list = Array.isArray(resData?.data) ? resData.data : (Array.isArray(resData) ? resData : []);
          list.forEach(p => {
            if (p && p.id !== undefined) {
              adminProductImages.set(String(p.id), normalizeImageUrl(p.image));
            }
          });
        }).catch(() => {});
      }

      return response;
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 rounded-2xl border border-slate-800 p-8 w-full max-w-sm shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-3xl mb-3 shadow-lg shadow-amber-500/20">⚡</div>
        <h1 class="text-2xl font-extrabold text-white">Admin Panel</h1>
        <p class="text-xs text-slate-400 mt-1">AutoOrder Premium Store</p>
      </div>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Username</label>
          <input type="text" id="admin-username" required placeholder="admin" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Password</label>
          <input type="password" id="admin-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-sm hover:from-amber-400 hover:to-orange-500 transition-all shadow-lg shadow-amber-500/25">Masuk Admin</button>
      </form>
      <div id="login-error" class="hidden mt-3 text-xs text-red-400 text-center"></div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel" class="hidden min-h-screen flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-60 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-40 transition-transform lg:translate-x-0 -translate-x-full">
      <div class="p-5 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-xl shadow">⚡</div>
          <div>
            <h2 class="font-bold text-white text-sm">AutoOrder</h2>
            <span class="text-[10px] text-amber-400 font-semibold uppercase tracking-wider">Admin Panel</span>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <button onclick="switchTab('dashboard')" class="sidebar-link active w-full text-left px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 transition-all" data-tab="dashboard">
          <span>📊</span> Dashboard
        </button>
        <button onclick="switchTab('products')" class="sidebar-link w-full text-left px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 text-slate-400 transition-all" data-tab="products">
          <span>📦</span> Kelola Produk
        </button>
        <button onclick="switchTab('accounts')" class="sidebar-link w-full text-left px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 text-slate-400 transition-all" data-tab="accounts">
          <span>🔑</span> Stok Akun
        </button>
        <button onclick="switchTab('orders')" class="sidebar-link w-full text-left px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 text-slate-400 transition-all" data-tab="orders">
          <span>📋</span> Rekap Transaksi
        </button>
        <button onclick="switchTab('users')" class="sidebar-link w-full text-left px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 text-slate-400 transition-all" data-tab="users">
          <span>👥</span> Pengguna
        </button>
      </nav>
      <div class="p-3 border-t border-slate-800">
        <button onclick="adminLogout()" class="w-full px-4 py-2.5 rounded-xl text-sm flex items-center gap-3 text-red-400 hover:bg-red-500/10 transition-all">
          <span>🚪</span> Keluar
        </button>
        <a href="index.html" class="mt-1 block px-4 py-2 rounded-xl text-xs text-slate-500 hover:text-slate-300 text-center">← Kembali ke Website</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-60">
      <!-- Top bar -->
      <header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800 px-6 py-3 flex items-center justify-between">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
        </button>
        <h1 id="page-title" class="text-lg font-bold text-white">📊 Dashboard</h1>
        <div class="flex items-center gap-2 text-xs">
          <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20">
            <span class="w-2 h-2 rounded-full bg-green-400 pulse-live"></span> Live
          </span>
        </div>
      </header>

      <!-- Content Area -->
      <div class="p-6" id="content-area">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div id="product-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 rounded-2xl border border-slate-700 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <h3 id="product-modal-title" class="text-base font-bold text-white">Tambah Produk</h3>
        <button onclick="closeProductModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form onsubmit="handleSaveProduct(event)" class="p-6 space-y-4">
        <input type="hidden" id="edit-product-id">
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2"><label class="text-xs font-semibold text-slate-300 block mb-1">Nama Produk *</label><input type="text" id="prod-name" required class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
          <div class="col-span-2">
            <label class="text-xs font-semibold text-slate-300 block mb-1">URL Gambar / Logo Produk</label>
            <div class="flex items-center gap-3">
              <input type="text" id="prod-image" placeholder="https://... (Paste link gambar logo aplikasi)" oninput="updateProdImagePreview(this.value)" class="flex-1 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
              <div id="prod-image-preview" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-lg overflow-hidden flex-shrink-0">📦</div>
            </div>
          </div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Kode Produk</label><input type="text" id="prod-code" placeholder="NTF-001" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Kategori</label>
            <select id="prod-category" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500">
              <option value="Streaming">Streaming</option><option value="Produktivitas">Produktivitas</option><option value="AI & Tools">AI & Tools</option><option value="Edukasi">Edukasi</option>
            </select>
          </div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Harga (Rp) *</label><input type="number" id="prod-price" required min="0" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Stok</label><input type="number" id="prod-stock" min="0" value="0" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
        </div>
        <div class="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-800/40 border border-slate-700/60">
          <div class="col-span-2 text-[11px] text-slate-400">💸 Harga Grosir Otomatis (opsional, isi 0 jika tidak dipakai)</div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Min. Beli (unit)</label><input type="number" id="prod-wmin" min="0" value="0" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
          <div><label class="text-xs font-semibold text-slate-300 block mb-1">Harga Grosir / unit (Rp)</label><input type="number" id="prod-wprice" min="0" value="0" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500"></div>
        </div>
        <div><label class="text-xs font-semibold text-slate-300 block mb-1">Deskripsi Produk</label><textarea id="prod-desc" rows="3" placeholder="Deskripsi lengkap produk..." class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500 resize-none"></textarea></div>
        <div><label class="text-xs font-semibold text-slate-300 block mb-1">Syarat & Ketentuan (SnK)</label><textarea id="prod-snk" rows="3" placeholder="Cara login, cara pakai, ketentuan garansi..." class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500 resize-none"></textarea></div>
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
            <input type="checkbox" id="prod-active" checked class="rounded accent-amber-500"> Tampilkan Produk
          </label>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeProductModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white text-sm font-bold shadow-lg shadow-amber-500/25">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Balance Modal -->
  <div id="balance-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 rounded-2xl border border-slate-800 w-full max-w-sm p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-white">💰 Kelola Saldo</h3>
        <button onclick="closeBalanceModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      <form onsubmit="handleSaveBalance(event)" class="space-y-3">
        <input type="hidden" id="balance-user-id">
        <div class="p-3 rounded-xl bg-slate-800/60 text-xs text-slate-300">
          User: <b id="balance-username" class="text-white">-</b><br>
          Saldo saat ini: <b id="balance-current" class="text-teal-400">Rp 0</b>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Aksi</label>
          <select id="balance-action" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500">
            <option value="add">➕ Tambah Saldo (Deposit)</option>
            <option value="subtract">➖ Kurangi Saldo</option>
            <option value="set">✏️ Set Saldo</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Nominal (Rp)</label>
          <input type="number" id="balance-amount" required min="0" placeholder="50000" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-500">
          <div class="flex gap-2 mt-2">
            <button type="button" onclick="document.getElementById('balance-amount').value=10000" class="flex-1 py-1 rounded-lg bg-slate-800 text-[11px] text-slate-300 hover:bg-slate-700">10rb</button>
            <button type="button" onclick="document.getElementById('balance-amount').value=25000" class="flex-1 py-1 rounded-lg bg-slate-800 text-[11px] text-slate-300 hover:bg-slate-700">25rb</button>
            <button type="button" onclick="document.getElementById('balance-amount').value=50000" class="flex-1 py-1 rounded-lg bg-slate-800 text-[11px] text-slate-300 hover:bg-slate-700">50rb</button>
            <button type="button" onclick="document.getElementById('balance-amount').value=100000" class="flex-1 py-1 rounded-lg bg-slate-800 text-[11px] text-slate-300 hover:bg-slate-700">100rb</button>
          </div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeBalanceModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-white text-sm font-bold">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Toast -->
  <div id="admin-toast-container" class="fixed bottom-5 right-5 z-[100] space-y-2"></div>

  <script src="js/admin.js"></script>
  <script>
    const productModalEl = document.getElementById('product-modal');
    if (productModalEl) {
      let wasHidden = true;
      const observer = new MutationObserver(() => {
        const isHidden = productModalEl.classList.contains('hidden');
        if (wasHidden && !isHidden) {
          setTimeout(() => {
            const editId = document.getElementById('edit-product-id')?.value || '';
            const imgInput = document.getElementById('prod-image');
            if (imgInput) {
              const savedImg = editId ? (adminProductImages.get(String(editId)) || '') : '';
              imgInput.value = savedImg;
              updateProdImagePreview(savedImg);
            }
          }, 20);
        }
        wasHidden = isHidden;
      });
      observer.observe(productModalEl, { attributes: true, attributeFilter: ['class'] });
    }
  </script>
</body>
</html>
